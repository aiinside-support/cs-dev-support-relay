name: Relay CS Commands to Private Repo

on:
  issues:
    types: [opened]

jobs:
  process-command:
    runs-on: ubuntu-latest
    steps:
      - name: Process Teams command and update relay issue body
        env:
          RELAY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          RELAY_REPO: ${{ github.repository }}
          RELAY_ISSUE_NUMBER: ${{ github.event.issue.number }}
          RELAY_TITLE: ${{ github.event.issue.title }}
          RELAY_BODY: ${{ github.event.issue.body }}
          RELAY_LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          python3 - << 'EOF'
          import os, re, json, urllib.request

          r_tok, t_tok = os.environ["RELAY_TOKEN"], os.environ["TARGET_TOKEN"]
          r_repo, r_num = os.environ["RELAY_REPO"], os.environ["RELAY_ISSUE_NUMBER"]
          title, body = os.environ.get("RELAY_TITLE", ""), os.environ.get("RELAY_BODY", "")
          r_labels = json.loads(os.environ.get("RELAY_LABELS", "[]"))
          t_repo = "aiinside-support/cs-dev-support"

          def api(url, tok, method="GET", data=None):
              hdr = {"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json", "User-Agent": "gh-relay"}
              req = urllib.request.Request(url, json.dumps(data).encode() if data else None, hdr, method=method)
              with urllib.request.urlopen(req) as res:
                  raw = res.read().decode()
                  return json.loads(raw) if raw else {}

          def author_of(txt):
              for ln in (txt or "").splitlines():
                  m = re.match(r"^起票者[:：]\s*(.+)$", ln.replace("**", "").lstrip("# ").strip())
                  if m:
                      return m.group(1).strip()
              return "不明"

          comb = f"{title} {body}"
          is_cmd = any(k in comb for k in ["[LIST_REQUEST]", "[DETAIL_REQUEST]", "[CLOSE_REQUEST]", "[REPLY_REQUEST]", "action:comment", "action:close", "Issue一覧", "Issue詳細", "Issue完了"])

          if "status: 新規" in r_labels or not is_cmd:
              create_labels = r_labels if r_labels else ["status: 新規"]
              lines = []
              for ln in body.replace("\r\n", "\n").splitlines():
                  s = ln.strip()
                  if s and set(s) <= {"=", "-"}:
                      continue
                  lines.append(re.sub(r"^#+\s*", "", s))
              raw_joined = "\n".join(lines).strip()
              clean_body = re.sub(r"\n{2,}", lambda m: "\n" * max(1, len(m.group(0)) // 2), raw_joined)
              created = api(f"https://api.github.com/repos/{t_repo}/issues", t_tok, "POST", {
                  "title": title,
                  "body": clean_body,
                  "labels": create_labels
              })
              new_num = created["number"]
              reply = f"✅ 開発チームへ起票しました（Issue番号：#{new_num}）"
          else:
              parts = body.split("===\n", 1)
              content = parts[1].strip() if len(parts) > 1 else body.strip()

              m = re.search(r"(\d+)", title) or re.search(r"(?:Issue番号|管理番号)[:：]?\s*#?(\d+)", body) or re.search(r"#(\d+)", body)
              num = m.group(1) if m else ""
              if not num and "[LIST_REQUEST]" not in comb and "Issue一覧" not in comb:
                  for it in api(f"https://api.github.com/repos/{t_repo}/issues?state=all&per_page=100", t_tok):
                      if "pull_request" not in it and (it.get("title") or "").strip() in body:
                          num = str(it["number"])
                          break

              if "[LIST_REQUEST]" in comb or "Issue一覧" in comb:
                  items = [it for it in api(f"https://api.github.com/repos/{t_repo}/issues?state=open&per_page=50", t_tok) if "pull_request" not in it]
                  lines = [f"・#{it['number']} [{' / '.join(re.sub(r'^status:\s*', '', l['name']) for l in it.get('labels', [])) or '未設定'}] {it.get('title', '')}（起票者：{author_of(it.get('body'))}）" for it in items]
                  reply = "【対応中のIssue一覧】\n" + ("\n".join(lines) if lines else "現在対応中（Open）のIssueはありません。")
              elif not num:
                  reply = "管理番号（Issue番号）を特定できませんでした。"
              elif "[DETAIL_REQUEST]" in comb or "Issue詳細" in comb:
                  it = api(f"https://api.github.com/repos/{t_repo}/issues/{num}", t_tok)
                  st = " / ".join(re.sub(r"^status:\s*", "", l["name"]) for l in it.get("labels", [])) or "未設定"
                  cmts = api(f"https://api.github.com/repos/{t_repo}/issues/{num}/comments", t_tok)
                  c_txt = "\n\n".join(f"・{c['user']['login']}：\n{c.get('body', '')}" for c in cmts) if cmts else "（コメントはまだありません）"
                  reply = f"■ #{num} {it.get('title', '（タイトルなし）')}\nステータス：{st}\n起票者：{author_of(it.get('body'))}\n--------------------\n【コメント履歴】\n{c_txt}"
              elif "[CLOSE_REQUEST]" in comb or "Issue完了" in comb:
                  txt = "\n".join(ln for ln in content.splitlines() if "Issue完了" not in ln).strip()
                  api(f"https://api.github.com/repos/{t_repo}/issues/{num}/comments", t_tok, "POST", {"body": f"{txt}\n\n（CS側より完了操作が実行されました）"})
                  api(f"
