name: Relay CS Commands to Private Repo

on:
  issues:
    types: [opened]

jobs:
  process-command:
    runs-on: ubuntu-latest
    steps:
      - name: Process Teams command and update relay issue body
        env:
          RELAY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          RELAY_REPO: ${{ github.repository }}
          RELAY_ISSUE_NUMBER: ${{ github.event.issue.number }}
          RELAY_TITLE: ${{ github.event.issue.title }}
          RELAY_BODY: ${{ github.event.issue.body }}
          RELAY_LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          python3 - << 'EOF'
          import os, re, json, urllib.request, urllib.error

          r_tok = os.environ["RELAY_TOKEN"]
          t_tok = os.environ["TARGET_TOKEN"]
          r_repo = os.environ["RELAY_REPO"]
          r_num = os.environ["RELAY_ISSUE_NUMBER"]
          title = os.environ.get("RELAY_TITLE", "")
          body = os.environ.get("RELAY_BODY", "")
          r_labels = json.loads(os.environ.get("RELAY_LABELS", "[]"))
          t_repo = "aiinside-support/cs-dev-support"

          def api(url, tok, method="GET", data=None):
              hdr = {
                  "Authorization": f"Bearer {tok}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "gh-relay"
              }
              payload = json.dumps(data).encode() if data else None
              req = urllib.request.Request(url, payload, hdr, method=method)
              with urllib.request.urlopen(req) as res:
                  raw = res.read().decode()
                  return json.loads(raw) if raw else {}

          def get_author(txt):
              for ln in (txt or "").splitlines():
                  clean = ln.replace("**", "").lstrip("# ").strip()
                  m = re.match(r"^起票者[:：]\s*(.+)$", clean)
                  if m:
                      return m.group(1).strip()
              return "不明"

          def get_status(it):
              lbs = it.get("labels", [])
              names = [re.sub(r"^status:\s*", "", l["name"]) for l in lbs]
              return " / ".join(names) or "未設定"

          def format_comment(raw_txt, skip_word):
              lines = [ln.strip() for ln in raw_txt.splitlines() if skip_word not in ln and ln.strip()]
              joined = "\n".join(lines)
              # 改行がスペースに潰れた箇条書き（・や-や1.）の前に改行を復元
              joined = re.sub(r"[  ]+([・●■◆\-]|\d+[\.．\)）])", r"\n\1", joined)
              # GitHubコメントで改行が確実に反映されるよう各行末に半角スペース2つを付与
              return "\n".join(f"{ln}  " for ln in joined.splitlines())

          parts = body.split("===\n", 1)
          after_sep = parts[1] if len(parts) > 1 else body
          current_msg = after_sep.split('{"@odata.', 1)[0].strip()
          cmd_target = f"{title} {current_msg}"

          cmds = [
              "[LIST_REQUEST]", "[DETAIL_REQUEST]", "[CLOSE_REQUEST]",
              "[REPLY_REQUEST]", "action:comment", "action:close",
              "Issue一覧", "Issue詳細", "Issue完了"
          ]
          is_cmd = any(k in cmd_target for k in cmds)

          if "status: 新規" in r_labels or not is_cmd:
              lbs = r_labels if r_labels else ["status: 新規"]
              lines = []
              for ln in body.replace("\r\n", "\n").splitlines():
                  s = ln.strip()
                  if s and set(s) <= {"=", "-"}:
                      continue
                  lines.append(re.sub(r"^#+\s*", "", s))
              joined = "\n".join(lines).strip()
              clean = re.sub(
                  r"\n{2,}",
                  lambda m: "\n" * max(1, len(m.group(0)) // 2),
                  joined
              )
              clean = re.sub(r"\n*(thread_id\s*[:：])", r"\n\n\1", clean)
              res = api(
                  f"https://api.github.com/repos/{t_repo}/issues",
                  t_tok, "POST",
                  {"title": title, "body": clean, "labels": lbs}
              )
              reply = f"✅ 開発チームへ起票しました（Issue番号：#{res['number']}）"
          else:
              num = ""
              tm = re.search(r'"replyToId"\s*:\s*"(\d+)"', body) or re.search(r"messages\('(\d+)'\)", body)
              tid = tm.group(1) if tm else ""
              if tid:
                  url = f"https://api.github.com/repos/{t_repo}/issues?state=all&per_page=100"
                  for it in api(url, t_tok):
                      if "pull_request" not in it and tid in (it.get("body") or ""):
                          num = str(it["number"])
                          break

              if not num:
                  m = re.search(r"(?:Issue番号|管理番号)\s*[:：]\s*#?(\d+)", current_msg) or re.search(r"#(\d+)", current_msg)
                  num = m.group(1) if m else ""

              if "[LIST_REQUEST]" in cmd_target or "Issue一覧" in cmd_target:
                  url = f"https://api.github.com/repos/{t_repo}/issues?state=open&per_page=50"
                  items = [it for it in api(url, t_tok) if "pull_request" not in it]
                  rows = [
                      f"・#{it['number']} [{get_status(it)}] {it.get('title', '')}（起票者：{get_author(it.get('body'))}）"
                      for it in items
                  ]
                  reply = "【対応中のIssue一覧】\n" + ("\n".join(rows) if rows else "現在対応中（Open）のIssueはありません。")
              elif not num:
                  reply = f"管理番号を特定できませんでした（thread_id: {tid or 'なし'}）。"
              else:
                  try:
                      if "[DETAIL_REQUEST]" in cmd_target or "Issue詳細" in cmd_target:
                          it = api(f"https://api.github.com/repos/{t_repo}/issues/{num}", t_tok)
                          cmts = api(f"https://api.github.com/repos/{t_repo}/issues/{num}/comments", t_tok)
                          if cmts:
                              c_txt = "\n\n".join(f"・{c['user']['login']}：\n{c.get('body', '')}" for c in cmts)
                          else:
                              c_txt = "コメントなし"
                          reply = (
                              f"■ #{num} {it.get('title', '（タイトルなし）')}\n"
                              f"ステータス：{get_status(it)}\n"
                              f"起票者：{get_author(it.get('body'))}\n"
                              f"--------------------\n"
                              f"【コメント履歴】\n{c_txt}"
                          )
                      elif "[CLOSE_REQUEST]" in cmd_target or "Issue完了" in cmd_target:
                          txt = format_comment(current_msg, "Issue完了")
                          api(
                              f"https://api.github.com/repos/{t_repo}/issues/{num}/comments",
                              t_tok, "POST",
                              {"body": f"{txt}\n\n（CS側より完了操作が実行されました）"}
                          )
                          api(
                              f"https://api.github.com/repos/{t_repo}/issues/{num}",
                              t_tok, "PATCH",
                              {"state": "closed", "labels": ["status: 完了"]}
                          )
                          reply = f"管理番号：#{num} を完了（クローズ）にしました。"
                      else:
                          txt = format_comment(current_msg, "Issue追加質問")
                          api(
                              f"https://api.github.com/repos/{t_repo}/issues/{num}/comments",
                              t_tok, "POST",
                              {"body": txt}
                          )
                          reply = f"管理番号：#{num} にコメントを追記しました。"
                  except urllib.error.HTTPError as e:
                      reply = f"Issue #{num} の取得に失敗しました（HTTP {e.code} / thread_id: {tid}）。"

          api(
              f"https://api.github.com/repos/{r_repo}/issues/{r_num}",
              r_tok, "PATCH",
              {"body": reply, "state": "closed"}
          )
          EOF
