name: Relay Issue to Private Repo

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Process Relay Request
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # パターンA：一覧取得リクエストの場合
          if [ "$ISSUE_TITLE" = "[LIST_REQUEST]" ]; then
            ISSUES_JSON=$(curl -s -H "Authorization: Bearer $TARGET_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/aiinside-support/cs-dev-support/issues?state=open&per_page=30")

            LIST_TEXT=$(echo "$ISSUES_JSON" | jq -r '
              [.[] | select(.pull_request == null)] |
              if length == 0 then
                "現在対応中のIssueはありません。"
              else
                map("・#" + (.number|tostring) + " [" + ([.labels[].name] | join(", ")) + "] " + .title) | join("\n")
              end
            ')

            curl -s -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$SRC_REPO/issues/$ISSUE_NUMBER" \
              -d "$(jq -n --arg body "$LIST_TEXT" '{title: "List Completed", body: $body, state: "closed"}')"
            exit 0
          fi

          # パターンB：通常の新規Issue転送（従来通り）
          CLEAN_BODY=$(echo "$ISSUE_BODY" | sed '/^===$/,$d')

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $TARGET_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/aiinside-support/cs-dev-support/issues \
            -d "$(jq -n --arg title "$ISSUE_TITLE" --arg body "$CLEAN_BODY" '{title: $title, body: $body, labels: ["status: 新規"]}')")

          CREATED_NUM=$(echo "$RESPONSE" | jq -r '.number')
          if [ "$CREATED_NUM" = "null" ] || [ -z "$CREATED_NUM" ]; then
            echo "Error response: $RESPONSE"
            exit 1
          fi

          THREAD_ID=$(echo "$ISSUE_BODY" | grep '^thread_id:' | cut -d':' -f2-)
          curl -s -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$SRC_REPO/issues/$ISSUE_NUMBER" \
            -d "$(jq -n --arg title "Relayed #$CREATED_NUM" --arg body "thread_id:$THREAD_ID" '{title: $title, body: $body, state: "closed"}')"
