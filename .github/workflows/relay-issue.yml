name: Relay CS Commands to Private Repo

on:
  issues:
    types: [opened]

jobs:
  process-command:
    runs-on: ubuntu-latest
    steps:
      - name: Process Teams command and update relay issue body
        env:
          RELAY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          RELAY_REPO: ${{ github.repository }}
          RELAY_ISSUE_NUMBER: ${{ github.event.issue.number }}
          RELAY_TITLE: ${{ github.event.issue.title }}
          RELAY_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - << 'EOF'
          import os, re, json, urllib.request

          relay_token = os.environ["RELAY_TOKEN"]
          target_token = os.environ["TARGET_TOKEN"]
          relay_repo = os.environ["RELAY_REPO"]
          relay_num = os.environ["RELAY_ISSUE_NUMBER"]
          title = os.environ.get("RELAY_TITLE", "")
          body = os.environ.get("RELAY_BODY", "")
          target_repo = "aiinside-support/cs-dev-support"

          def gh_api(url, token, method="GET", data=None):
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "gh-actions-relay"
              }
              body_bytes = json.dumps(data).encode("utf-8") if data is not None else None
              req = urllib.request.Request(url, data=body_bytes, headers=headers, method=method)
              with urllib.request.urlopen(req) as resp:
                  raw = resp.read().decode("utf-8")
                  return json.loads(raw) if raw else {}

          def extract_author_and_body(raw_body):
              author = "不明"
              q_lines = []
              for ln in (raw_body or "").splitlines():
                  clean_ln = ln.replace("**", "").strip()
                  m = re.match(r"^起票者[:：]\s*(.+)$", clean_ln)
                  if m and author == "不明":
                      author = m.group(1).strip()
                  else:
                      q_lines.append(ln)
              q_body = "\n".join(q_lines).strip() or "（記載なし）"
              return author, q_body

          # タイトル、または本文中の「管理番号：#20」「■ #20」「#20」からIssue番号を確実に抽出
          m = (
              re.search(r"(\d+)", title)
              or re.search(r"管理番号[:：]?\s*#?(\d+)", body)
              or re.search(r"■\s*#(\d+)", body)
              or re.search(r"#(\d+)", body)
          )
          issue_num = m.group(1) if m else ""

          parts = body.split("===\n", 1)
          content = parts[1].strip() if len(parts) > 1 else body.strip()
          combined = f"{title} {body}"

          if "[LIST_REQUEST]" in combined or "Issue一覧" in combined:
              issues = gh_api(f"https://api.github.com/repos/{target_repo}/issues?state=open&per_page=50", target_token)
              lines = []
              for it in issues:
                  if "pull_request" in it:
                      continue
                  num = it["number"]
                  it_title = it.get("title", "")
                  labels = [re.sub(r"^status:\s*", "", lb["name"]) for lb in it.get("labels", [])]
                  status_str = " / ".join(labels) if labels else "未設定"
                  author, _ = extract_author_and_body(it.get("body") or "")
                  lines.append(f"・#{num} [{status_str}] {it_title}（起票者：{author}）")
              list_text = "\n".join(lines) if lines else "現在対応中（Open）のIssueはありません。"
              reply_text = f"【対応中のIssue一覧】\n{list_text}"

          elif not issue_num:
              reply_text = "管理番号（Issue番号）を特定できませんでした。"

          elif "[DETAIL_REQUEST]" in combined or "Issue詳細" in combined:
              it = gh_api(f"https://api.github.com/repos/{target_repo}/issues/{issue_num}", target_token)
              it_title = it.get("title", "（タイトルなし）")
              labels = [re.sub(r"^status:\s*", "", lb["name"]) for lb in it.get("labels", [])]
              status_str = " / ".join(labels) if labels else "未設定"
              author, q_body = extract_author_and_body(it.get("body") or "")

              comments = gh_api(f"https://api.github.com/repos/{target_repo}/issues/{issue_num}/comments", target_token)
              if not comments:
                  c_text = "（コメントはまだありません）"
              else:
                  c_text = "\n\n".join([f"・{c['user']['login']}：\n{c.get('body', '')}" for c in comments])

              reply_text = (
                  f"■ #{issue_num} {it_title}\n"
                  f"ステータス：{status_str}\n"
                  f"起票者：{author}\n"
                  f"--------------------\n"
                  f"【質問内容】\n{q_body}\n"
                  f"--------------------\n"
                  f"【コメント履歴】\n{c_text}"
              )

          elif "[CLOSE_REQUEST]" in combined or "Issue完了" in combined:
              gh_api(f"https://api.github.com/repos/{target_repo}/issues/{issue_num}/comments", target_token, "POST", {"body": f"{content}\n\n（CS側より完了操作が実行されました）"})
              gh_api(f"https://api.github.com/repos/{target_repo}/issues/{issue_num}", target_token, "PATCH", {"state": "closed", "labels": ["status: 完了"]})
              reply_text = f"管理番号：#{issue_num} を完了（クローズ）にしました。"

          else:
              clean_comment = re.sub(r"Issue追加質問\s*", "", content).strip()
              gh_api(f"https://api.github.com/repos/{target_repo}/issues/{issue_num}/comments", target_token, "POST", {"body": clean_comment})
              reply_text = f"管理番号：#{issue_num} にコメントを追記しました。"

          gh_api(
              f"https://api.github.com/repos/{relay_repo}/issues/{relay_num}",
              relay_token,
              "PATCH",
              {"body": reply_text, "state": "closed"}
          )
          EOF
